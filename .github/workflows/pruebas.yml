# Compila y corre las pruebas en Windows y Linux en cada push y pull request.
# Las versiones de GHC y cabal coinciden con las de cabal.project.freeze,
# que fija base a GHC 9.10.3.
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.16.1.0'

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze', 'sulfur.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-

      - run: cabal update
      - run: cabal build all --enable-tests
      - run: cabal test --test-show-details=direct
